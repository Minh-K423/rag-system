[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-system"
version = "0.1.0"
description = "An uncompleted RAG system, full of flaws"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "safetensors",
    "qdrant-client>=1.9.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv",
    "pyyaml",
    "requests",
    "httpx",
    "matplotlib",
    "rich",
    "tqdm",
    "click",
    "typer",
    "pillow",
    "jinja2",
    "pyqt6",
    "pydantic-settings>=2.16.1",
]

[tool.setuptools.packages.find]
where = ["."]
